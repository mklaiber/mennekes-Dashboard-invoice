name: Build and Publish Docker Image

on:
  push:
    branches: [main]
  # Zusaetzlich zum Muster der anderen Repos: erlaubt einen Build von Hand,
  # auch aus einem Branch, der nicht der Default ist. Dabei entsteht nur der
  # SHA-Tag -- "latest" haengt bewusst am Default-Branch (metadata-action).
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # Gleiche Major-Version wie das Dockerfile (node:22-bookworm-slim),
          # damit die Tests auf derselben Laufzeit laufen wie die Produktion.
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

  connector-test:
    # Der Connector wird NICHT in dieses Image gebaut -- er laeuft als
    # Home-Assistant-Add-on im Heimnetz. Er liegt aber im selben Repo und
    # spricht ueber /api/ingest mit dieser App, deshalb wird er hier
    # mitgeprueft.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install connector dependencies
        run: npm ci
        working-directory: mennekes-connector/app

      - name: Run connector tests
        run: npm test
        working-directory: mennekes-connector/app

  build-and-push:
    # Erst bauen und veroeffentlichen, wenn Lint und beide Testsuiten gruen
    # sind -- sonst landet ein kaputtes :latest in der Registry.
    needs: [test, connector-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          # Der k3s-Knoten ist x86_64; ohne diese Angabe wuerde der Runner
          # zwar ebenfalls amd64 bauen, die Absicht waere aber nicht
          # dokumentiert und ein arm64-Runner spaeter ein stiller Fehler.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: [build-and-push]
    # Nur vom Default-Branch ausrollen: ein manueller Build aus einem
    # Feature-Branch soll die laufende Instanz nicht ersetzen.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      # Der SSH-Key ist serverseitig per "forced command" auf genau den
      # Rollout-Restart dieses Deployments beschraenkt; das hier angegebene
      # Kommando dient nur der Dokumentation.
      - name: Restart deployment on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: kubectl rollout restart deployment/mennekes-billing -n mennekes-billing
