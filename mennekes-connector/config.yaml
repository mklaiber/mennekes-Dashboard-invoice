# =============================================================================
#  Home-Assistant-Add-on: Mennekes Wallbox Connector
#
#  Reiner Datenvermittler. Liest die Wallbox im Heimnetz aus (Modbus TCP oder
#  REST, je nach Geräteklasse) und schiebt die Werte an das Online-Tool. Die
#  Verbindung geht ausschließlich von hier nach AUSSEN - die Wallbox bleibt im
#  LAN und braucht weder eine Portweiterleitung noch eine öffentliche Adresse.
# =============================================================================

name: Mennekes Wallbox Connector
version: "1.3.0"
slug: mennekes_connector
description: >-
  Liest die Ladedaten einer MENNEKES Wallbox im Heimnetz aus und übermittelt sie
  an die Online-Abrechnung. Ausschließlich ausgehende Verbindungen.
url: https://github.com/mklaiber/mennekes-Dashboard-invoice

arch:
  - aarch64
  - amd64
  - armv7

# Der Connector braucht keine offenen Ports: er ruft nur nach außen.
# Kein "ports"-Abschnitt, kein "ingress", keine "webui".

init: false
startup: application
boot: auto

# Zugriff auf das lokale Netz, um die Wallbox zu erreichen.
host_network: false

# Zusätzliche Freigaben sind nicht nötig: /data steht jedem Add-on zur
# Verfügung und wird von Home Assistant persistiert. Dort liegt die
# Warteschlange der noch nicht zugestellten Ladevorgänge.

# Vorbelegt für eine MENNEKES AMTRON Professional/Professional+/ChargeControl
# (und verwandte Bender-CC-Plattform-Geräte: AMEDIO Professional, Bender
# CC612/613, ...): DIESE Geräteklasse hat laut offizieller Anleitung KEINE
# REST-Schnittstelle - nur Modbus TCP und OCPP. An der Wallbox müssen dafür
# einmalig "Modbus TCP Server für Energiemanagement-Systeme" aktiviert und
# "Registersatz" auf "Ebee"/"Bender"/"MENNEKES" gestellt werden (NICHT
# "Phoenix"/"TQ-DM100"), siehe DOCS.md.
#
# Für die ältere Xtra/Premium-Generation (MHCP/1.0-REST-Schnittstelle, "System
# → REST-Schnittstelle: Aktiviert" in den Systeminformationen) unten
# wallbox_protocol auf "rest" umstellen - siehe DOCS.md.
options:
  wallbox_protocol: modbus
  wallbox_url: "http://192.168.1.50"
  wallbox_modbus_port: 502
  wallbox_modbus_unit_id: 255
  wallbox_auth_mode: none
  wallbox_username: ""
  wallbox_password: ""
  wallbox_token: ""
  wallbox_auth_query_param: ""
  endpoint_status: "/api/v1/status"
  endpoint_sessions: "/api/v1/transactions"
  endpoint_meter: ""
  wallbox_sessions_protocol: simple
  target_url: "https://abrechnung.example.com"
  target_token: ""
  status_interval_seconds: 2
  sessions_interval_seconds: 900
  history_days: 45
  verify_tls: true
  wallbox_verify_tls: true
  log_level: info
  # Home-Assistant-Sensoren über MQTT - optional. Leer lassen, um sie zu
  # deaktivieren. Läuft das Mosquitto-Add-on bereits, heißt der Broker im
  # Docker-Netz üblicherweise "core-mosquitto" (Port 1883, ohne SSL).
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_ssl: false
  mqtt_discovery_prefix: homeassistant
  mqtt_node_id: mennekes_wallbox
  mqtt_device_name: "Mennekes Wallbox"

schema:
  # --- Wallbox im Heimnetz --------------------------------------------------
  wallbox_protocol: "list(modbus|rest)"
  wallbox_url: url
  # Nur für wallbox_protocol='modbus'.
  wallbox_modbus_port: port
  wallbox_modbus_unit_id: "int(1,255)"
  # Alles Folgende nur für wallbox_protocol='rest'.
  wallbox_auth_mode: "list(none|basic|bearer|apikey|query)"
  wallbox_username: str?
  wallbox_password: password?
  wallbox_token: password?
  wallbox_auth_query_param: str?
  endpoint_status: str
  endpoint_sessions: str
  endpoint_meter: str?
  wallbox_sessions_protocol: "list(simple|amtron-stateful)"
  wallbox_verify_tls: bool

  # --- Online-Tool ----------------------------------------------------------
  target_url: url
  target_token: password
  verify_tls: bool

  # --- Takt -----------------------------------------------------------------
  # Live-Werte häufig, Historie selten: abgeschlossene Ladevorgänge ändern sich
  # nicht mehr, ein Abruf alle 15 Minuten genügt.
  status_interval_seconds: "int(2,300)"
  sessions_interval_seconds: "int(60,86400)"
  history_days: "int(1,365)"

  log_level: "list(debug|info|warn|error)"

  # --- Home Assistant: Sensoren über MQTT (optional, siehe DOCS.md) --------
  mqtt_host: str?
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  mqtt_ssl: bool
  mqtt_discovery_prefix: str
  mqtt_node_id: str
  mqtt_device_name: str
